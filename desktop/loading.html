<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'">
  <title>온빛누리 시작</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #071225; }
    body { background: #071225 url('background.png') center / cover no-repeat; }
    .brand { position: absolute; left: 50%; top: 42%; width: min(82vw, 940px); transform: translate(-50%, -50%); display: grid; grid-template-columns: 20% 76%; gap: 4%; align-items: center; }
    .mark { display: block; width: 100%; height: auto; }
    .brand-text { display: block; width: 100%; overflow: visible; font-family: 'Malgun Gothic', 'Segoe UI', sans-serif; filter: drop-shadow(0 2px 5px #071225); }
    .track { position: absolute; left: 50%; top: 60%; transform: translate(-50%, -50%); width: min(70vw, 700px); height: 20px; border: 1px solid #a8a8a8; border-radius: 999px; background: #e6e6e6; overflow: hidden; }
    .fill { width: 0; height: 100%; border-radius: inherit; background: #409fea; border: 1px solid #b9daf5; transition: width 240ms ease-out; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
    @media (prefers-reduced-motion: reduce) { .fill { transition: none; } }
  </style>
</head>
<body>
  <div class="brand">
    <img class="mark" src="appicon.png" alt="">
    <svg class="brand-text" viewBox="0 0 700 140" role="img" aria-label="국방동원정보체계 2.0 — DEFENCE MOBILIZATION INFORMATION SYSTEM 2.0">
      <text x="0" y="72" fill="white" font-size="62" font-weight="600" textLength="700" lengthAdjust="spacingAndGlyphs">국방동원정보체계 2.0</text>
      <text x="0" y="119" fill="#e0e6ef" font-size="25" textLength="700" lengthAdjust="spacingAndGlyphs">DEFENCE MOBILIZATION INFORMATION SYSTEM 2.0</text>
    </svg>
  </div>
  <div id="progress" class="track" role="progressbar" aria-label="앱 준비 진행률" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
    <div id="fill" class="fill"></div>
  </div>
  <p id="status" class="sr-only" role="status" aria-live="polite">시작 준비 중</p>
</body>
</html>
